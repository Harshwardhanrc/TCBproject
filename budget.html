<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget - Budget Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app-container">
    <h1>Budget Tracker</h1>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="expenses.html">Transactions</a>
      <a href="add.html">Add Transaction</a>
      <a href="budget.html" class="active">Budget</a>
    </nav>
    <h2>Set Monthly Budget</h2>
    <form onsubmit="saveBudget(); return false;">
      <div>
        <label>Budget Amount (₹):</label>
        <input type="number" id="budget-input" name="budget" placeholder="Enter your budget amount" />
      </div>
      <button type="submit">Update Budget</button>
      <button type="button" onclick="deleteBudget()" style="margin-top:10px; background:#ef4444;">
        Delete Budget
      </button>
    </form>
  </div>
  <script src="app.js"></script>
</body>

</html>
