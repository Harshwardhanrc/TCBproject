<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Budget Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app-container">
    <h1>Budget Tracker</h1>

    <nav>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="expenses.html">Transactions</a>
      <a href="add.html">Add Transaction</a>
      <a href="budget.html">Budget</a>
    </nav>

    <h2>Dashboard</h2>

    <div class="stats-container">

      <div class="stat-card">
        <div class="stat-title">Monthly Budget</div>
        <div class="stat-value remaining" id="budget-display">₹0</div>
      </div>

      <div class="stat-card">
        <div class="stat-title">Total Income</div>
        <div class="stat-value income" id="total-income">₹0</div>
      </div>

      <div class="stat-card">
        <div class="stat-title">Total Spent</div>
        <div class="stat-value expense" id="total-spent">₹0</div>
      </div>

      <div class="stat-card">
        <div class="stat-title">Remaining</div>
        <div class="stat-value remaining" id="remaining">₹0</div>
      </div>

    </div>

    <div class="chart-card">
      <h3>Category Wise Expenses</h3>
      <canvas id="expense-pie-chart" width="300" height="300"></canvas>
      <div class="chart-legend" id="expense-chart-legend">
        <div class="chart-note">Loading chart...</div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
